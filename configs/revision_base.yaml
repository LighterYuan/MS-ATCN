seed: 42
device: auto

batch_size: 128
epochs: 50
learning_rate: 0.0005
weight_decay: 0.0001
val_ratio: 0.15
num_workers: 0

seq_len: 16
feature_scaling: standard

# MS-ATCN objective. The revision runner uses formula-consistent focal loss.
use_focal_loss: true
focal_gamma: 2.0
weighted_sampling: true
label_smoothing: 0.0

hidden_channels: 64
num_blocks: 4
dilations: [1, 2, 4, 8]
multi_scale_kernel_sizes: [3, 5, 7]
dropout: 0.1
use_channel_attention: true
use_temporal_attention: true

# Explicit baseline settings; kept equal to the supplied project's effective values.
baseline_hidden_dim: 64
baseline_dropout: 0.1

early_stopping_patience: 10
grad_clip_norm: 5.0
scheduler_patience: 3
